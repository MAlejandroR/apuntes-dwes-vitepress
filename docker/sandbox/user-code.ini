memory_limit = 32M
max_execution_time = 3

open_basedir = /sandbox:/tmp

allow_url_fopen = Off
allow_url_include = Off

display_errors = stderr
display_startup_errors = On

disable_functions = exec,shell_exec,system,passthru,proc_open,proc_close,proc_terminate,popen,fsockopen,pfsockopen,stream_socket_client,stream_socket_server